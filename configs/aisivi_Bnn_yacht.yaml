seed: 42
cuda_visible_devices: "0"
use_cuda: true

runner_type: AISIVI
target_type: Bnn_yacht
vi_model_type: ConditionalGaussian
vi_model_config_path: configs/vi_models/ConditionalGaussian-Bnn-ksivi.yaml
reverse_model_type: ConditionalRealNVP
reverse_model_config_path: configs/reverse_models/ConditionalRealNVP-AISIVI-Bnn.yaml

train:
  epochs: 10000
  batch_size: 128
  reverse_sample_num: 256
  grad_clip: 1.0
  pretrain:
    enabled: true
    steps: 100
    lr: 1.0e-2
    batch_size: 100
  ema:
    enabled: true
    beta: 0.999
  vi:
    lr: 1.0e-5
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.9
  reverse:
    lr: 5.0e-5
    weight_decay: 0.0
    batch_size: 100
    epochs: 1
    update_freq: 1
    scheduler:
      type: StepLR
      step_size: 5000
      gamma: 0.01
  annealing:
    enabled: true
    scheme: linear
    steps: 10000
  log:
    metric_log_freq: 100
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: true
    freq: 1000
  sample:
    freq: 1000
    num: 100
  plot:
    freq: 1000
    num: 100

metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: false
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: true
    num_samples: 500
  expected_log_marginal:
    enabled: false
    num_ref_samples: 1000
    num_model_samples: 50000
    sample_batch_size: 50000
    dim_chunk: 50
    ref_chunk: 500
    model_chunk: 5000
    min_bandwidth: 1.0e-6
    dtype: float32

# KPG (Kernel Pathwise Gradient) on Langevin conditioned diffusion process (100-dimensional)
# Based on ksivi_Langevin_post.yaml with KPG-specific loss configuration.
seed: 42
cuda_visible_devices: "0"
use_cuda: true

runner_type: KPG
target_type: Langevin_post
vi_model_type: ConditionalGaussianGlobalUniform
vi_model_config_path: configs/vi_models/ConditionalGaussianGlobalUniform-AISIVI.yaml

train:
  epochs: 100000
  batch_size: 128
  vi:
    lr: 1.0e-3
    var_lr: 1.0e-3
    scheduler:
      type: StepLR
      step_size: 10000
      gamma: 0.9
  annealing:
    enabled: true
    scheme: linear
    steps: 50000
  kpg:
    kernel: gaussian
    detach_kernel: true
    log_p_reg: 0.0
  log:
    metric_log_freq: 1000
    loss_log_freq: 500
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: true
    freq: 10000
  sample:
    freq: 10000
    num: 1000
  plot:
    freq: 10000
    num: 1000

metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: true
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: true
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: true
    num_ref_samples: 1000
    num_model_samples: 50000
    sample_batch_size: 50000
    dim_chunk: 50
    ref_chunk: 500
    model_chunk: 5000
    min_bandwidth: 1.0e-6
    dtype: float32

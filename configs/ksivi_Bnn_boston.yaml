seed: 42
cuda_visible_devices: "0"
use_cuda: true

runner_type: KSIVI
target_type: Bnn_boston
vi_model_type: ConditionalGaussian
vi_model_config_path: configs/vi_models/ConditionalGaussian-Bnn-ksivi.yaml

train:
  epochs: 100000
  batch_size: 128
  grad_clip: 1.0
  pretrain:
    enabled: true
    steps: 100
    lr: 1.0e-2
    batch_size: 100
  ema:
    enabled: true
    beta: 0.999
  vi:
    lr: 1.0e-3
    var_lr: 1.0e-3
    scheduler:
      type: StepLR
      step_size: 3000
      gamma: 0.9
  annealing:
    enabled: false
    scheme: linear
    steps: 5000
  ksivi:
    statistic: v
    kernel: gaussian
    detach_kernel: false
    log_p_reg: 1.0
    log_p_reg_mode: always
  log:
    metric_log_freq: 1000
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: true
    freq: 10000
  sample:
    freq: 10000
    num: 100
  plot:
    freq: 10000
    num: 100

metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: false
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: true
    num_samples: 500
  expected_log_marginal:
    enabled: false
    num_ref_samples: 1000
    num_model_samples: 50000
    sample_batch_size: 50000
    dim_chunk: 50
    ref_chunk: 500
    model_chunk: 5000
    min_bandwidth: 1.0e-6
    dtype: float32
